name: Build album library

# Builds assets/catalogue.json (about 10,000 popular albums plus Bailey's
# sheet and expedition albums), commits it, then starts the phone and web builds.
on:
  push:
    branches: [main]
    paths: [data/albums.json, data/exceptions.json, data/genres.json, data/known_albums.json, tool/build_library.py, tool/check_library.py]
  workflow_dispatch:
    inputs:
      library_size:
        description: Number of popular albums
        default: "10000"
      seed_artists:
        description: Number of artists to look through
        default: "3500"
      commit:
        description: Commit the result
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      # Answers from earlier runs, so each run goes further and rebuilds are quick.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: library-answers-${{ github.run_id }}
          restore-keys: library-answers-
      - run: python3 tool/build_library.py
        env:
          LIBRARY_SIZE: ${{ inputs.library_size || '10000' }}
          MAX_SEED_ARTISTS: ${{ inputs.seed_artists || '3500' }}
          LISTENBRAINZ_TOKEN: ${{ secrets.LISTENBRAINZ_TOKEN }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: library-answers-${{ github.run_id }}
      - name: Check the library
        run: python3 tool/check_library.py
      - name: Save a preview copy on the library-preview branch
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b library-preview
          git add assets/catalogue.json data/sheet_ids.json
          git commit -m "Library preview [skip ci]"
          git push -f origin library-preview
      - name: Commit library and rebuild the app
        if: ${{ github.event_name == 'push' || inputs.commit }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet assets/catalogue.json data/sheet_ids.json; then
            echo "Library unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogue.json data/sheet_ids.json
          git commit -m "Update album library"
          git pull --rebase origin main
          git push
          gh workflow run build-android.yml --ref main
          gh workflow run deploy-web.yml --ref main
