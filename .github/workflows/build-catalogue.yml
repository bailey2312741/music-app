name: Build album catalogue

# Looks up album IDs and cover images for data/albums.json, commits
# assets/catalogue.json, then starts the phone and web builds.
on:
  push:
    branches: [main]
    paths: [data/albums.json, tool/build_catalogue.py]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tool/build_catalogue.py
      - name: Commit catalogue and rebuild the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet assets/catalogue.json; then
            echo "Catalogue unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogue.json
          git commit -m "Update album catalogue"
          git push
          gh workflow run build-android.yml --ref main
          gh workflow run deploy-web.yml --ref main
