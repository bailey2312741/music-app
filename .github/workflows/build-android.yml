name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: music-app-android
          path: build/app/outputs/flutter-apk/app-release.apk
      # Keep one "latest" download link that always points at the newest app.
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk music-app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest music-app.apk --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download music-app.apk on your Android phone and open it to install." \
            --target "$GITHUB_SHA"
